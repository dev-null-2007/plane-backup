# Throwaway debug pod with psql/mc/restic and the same credentials as the
# backup CronJob/restore Job already loaded as env vars. See README.md's
# "Debugging: interactive shell pod" section for usage.
#
# `kubectl apply -f manifests/plane-backup-shell.yaml -n <namespace>`
# overrides the namespace below without editing this file.
apiVersion: v1
kind: Pod
metadata:
  name: plane-backup-shell
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: localhost:32000/plane-backup:latest
      command: ["sleep", "3600"]
      envFrom:
        - secretRef:
            name: plane-backup-restic-creds
        - secretRef:
            name: plane-app-pgdb-secrets
        - secretRef:
            name: plane-app-doc-store-secrets
